# CTO gate: secret scan + test suites.
# NOTE: this package HAS a runtime dependency (@modelcontextprotocol/sdk), so the
# install step below is load-bearing. It was missing until 2026-09-11, which made
# every run since 2026-07-17 fail on ERR_MODULE_NOT_FOUND.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate + test matrix
        run: npm run ci

      - name: Tarball scope (no secrets, no test/)
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'total files:' /tmp/pack.txt
          ! grep -E '(^|/)test/' /tmp/pack.txt
          ! grep -E '\.cto-brain/' /tmp/pack.txt
