<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cto-brain chat — Secure Brain</title>
<style>
  :root {
    --bg: #0d0f0e; --panel: #141817; --line: #232826; --ink: #e6ede4;
    --dim: #8a9a86; --accent: #a7c4a0; --user: #1b2f28; --err: #d98a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; gap: 12px; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  header .brand { font-weight: 700; letter-spacing: .01em; }
  header .brand small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  select, input[type=password], button {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  button { background: var(--accent); color: #0d0f0e; border: 0; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; }
  .msg .who { font-size: 12px; color: var(--dim); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .06em; }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body { background: var(--user); padding: 10px 13px; border-radius: 10px; }
  .msg.err .body { color: var(--err); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  form .inner { max-width: 760px; width: 100%; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; min-height: 44px; max-height: 160px;
  }
  .hint { color: var(--dim); font-size: 13px; text-align: center; padding: 4px 0; }
</style>
</head>
<body>
<header>
  <span class="brand">cto-brain <small>Secure Brain</small></span>
  <label>Scope <select id="scope"></select></label>
  <label>Model <select id="model"></select></label>
  <span class="spacer"></span>
  <input id="token" type="password" placeholder="access token" size="14" />
</header>

<div id="log">
  <div class="msg"><div class="body hint">Grounded in your project's docs. Paste the access token (printed at boot), pick a scope, and ask.</div></div>
</div>

<form id="form">
  <div class="inner">
    <textarea id="input" placeholder="Ask about your project…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log"), tokenEl = $("token"), scopeEl = $("scope"), modelEl = $("model");
  const history = [];

  const TOKEN_KEY = "cto-chat-token";
  tokenEl.value = localStorage.getItem(TOKEN_KEY) || new URLSearchParams(location.search).get("token") || "";
  tokenEl.addEventListener("change", () => { localStorage.setItem(TOKEN_KEY, tokenEl.value); load(); });

  function authHeaders() { return { "X-CTO-Token": tokenEl.value, "content-type": "application/json" }; }

  function add(role, text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + (cls || role);
    el.innerHTML = '<div class="who"></div><div class="body"></div>';
    el.querySelector(".who").textContent = role;
    el.querySelector(".body").textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el.querySelector(".body");
  }

  async function load() {
    if (!tokenEl.value) return;
    try {
      const [p, m] = await Promise.all([
        fetch("/api/projects", { headers: authHeaders() }).then((r) => r.json()),
        fetch("/api/models", { headers: authHeaders() }).then((r) => r.json()),
      ]);
      scopeEl.innerHTML = ""; (p.projects || []).forEach((s) => {
        const o = document.createElement("option"); o.value = s.id; o.textContent = s.label; scopeEl.appendChild(o);
      });
      if (p.default) scopeEl.value = p.default;
      modelEl.innerHTML = ""; (m.models || []).forEach((x) => {
        const o = document.createElement("option"); o.value = x.id; o.textContent = x.label || x.id; modelEl.appendChild(o);
      });
      if (m.default) modelEl.value = m.default;
    } catch (e) { add("system", "Could not load config — check the token.", "err"); }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || !tokenEl.value) return;
    $("input").value = "";
    add("you", text, "user");
    history.push({ role: "user", content: text });
    const out = add("cto-brain", "", "assistant");
    $("send").disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ messages: history, model: modelEl.value, scope: scopeEl.value }),
      });
      if (res.status === 401) { out.textContent = "Unauthorized — check the access token."; out.parentElement.className = "msg err"; $("send").disabled = false; return; }
      const reader = res.body.getReader(); const dec = new TextDecoder();
      let buf = "", acc = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) !== -1) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line.startsWith("data:")) continue;
          const d = line.slice(5).trim();
          if (d === "[DONE]") continue;
          try { const j = JSON.parse(d); const t = j.choices?.[0]?.delta?.content; if (t) { acc += t; out.textContent = acc; log.scrollTop = log.scrollHeight; } } catch {}
        }
      }
      history.push({ role: "assistant", content: acc });
    } catch (err) {
      out.textContent = "Stream error: " + err.message; out.parentElement.className = "msg err";
    } finally { $("send").disabled = false; }
  });

  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
  });

  load();
</script>
</body>
</html>
